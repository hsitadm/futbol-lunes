<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Fútbol de los Lunes</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Saltar al contenido</a>

    <!-- Notificación -->
    <div id="notification" class="notification" role="alert" aria-live="polite"></div>

    <!-- Header -->
    <header class="header">
        <h1>⚽ Fútbol de los Lunes</h1>
        <p class="subtitle">Confirma tu asistencia al partido</p>
        <div class="game-date">📅 Próximo: <span id="game-date"></span></div>
        <a href="admin.html" class="nav-link">🔐 Admin</a>
    </header>

    <main id="main-content" class="container">
        <!-- Contador de confirmados -->
        <section class="card" aria-label="Estado de confirmaciones">
            <div class="progress-container">
                <div class="progress-count" id="confirmed-count">0/24</div>
                <div class="progress-label">jugadores confirmados</div>
                <div class="progress-bar-container" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="24">
                    <div class="progress-fill" id="progress-bar" style="width: 0%"></div>
                </div>
            </div>
        </section>

        <!-- Selección de jugador y acciones -->
        <section class="card" aria-label="Confirmar asistencia">
            <h2>Tu Asistencia</h2>
            <div class="form-group">
                <label for="player-select">¿Quién eres?</label>
                <select id="player-select" aria-describedby="player-help">
                    <option value="">-- Selecciona tu nombre --</option>
                </select>
                <small id="player-help" style="color: var(--text-light); margin-top: 0.25rem; display: block;">
                    Si no apareces en la lista, pide al admin que te registre.
                </small>
            </div>

            <!-- Estado del jugador -->
            <div id="player-status" class="player-status" style="display: none;"></div>

            <!-- Botones de acción -->
            <div class="btn-group">
                <button id="btn-confirm" class="btn btn-primary" onclick="confirmAttendance()" style="display: none;">
                    ✅ Confirmar Asistencia
                </button>
                <button id="btn-cancel" class="btn btn-danger" onclick="cancelAttendance()" style="display: none;">
                    ❌ Cancelar Asistencia
                </button>
            </div>
        </section>

        <!-- Lista de confirmados -->
        <section class="card" aria-label="Lista de confirmados">
            <h2>✅ Confirmados</h2>
            <ol class="player-list" id="confirmed-list">
                <li class="empty-state">Cargando...</li>
            </ol>

            <!-- Lista de espera -->
            <div id="waitlist-section" class="waitlist-section" style="display: none;">
                <h3>⏳ Lista de Espera</h3>
                <ol class="player-list" id="waitlist-list"></ol>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/whatsapp.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
